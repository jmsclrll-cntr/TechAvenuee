<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="ihsMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="intelBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="24" fill="#0B132B"/>
  <rect x="10" y="10" width="280" height="280" rx="20" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Green/Blue Substrate PCB Base (LGA1700 rectangular) -->
  <rect x="65" y="45" width="170" height="210" rx="10" fill="url(#intelBlue)" stroke="#0284C7" stroke-width="2"/>

  <!-- Gold Alignment Triangle -->
  <polygon points="72,52 86,52 72,66" fill="#FACC15"/>

  <!-- Metal IHS (Integrated Heat Spreader) -->
  <rect x="80" y="60" width="140" height="180" rx="8" fill="url(#ihsMetal)" stroke="#64748B" stroke-width="3"/>
  <rect x="86" y="66" width="128" height="168" rx="6" fill="#CBD5E1"/>

  <!-- Laser Etched Markings -->
  <text x="150" y="110" fill="#0F172A" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">intel.</text>
  <text x="150" y="132" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">CORE i7</text>
  
  <rect x="100" y="142" width="100" height="1.5" fill="#64748B"/>
  
  <text x="150" y="160" fill="#334155" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">i7-14700K</text>
  <text x="150" y="176" fill="#475569" font-family="monospace" font-size="9" text-anchor="middle">SRN2B 3.40GHZ</text>
  <text x="150" y="190" fill="#475569" font-family="monospace" font-size="8" text-anchor="middle">X348K892 LGA1700</text>
  
  <!-- 2D DataMatrix barcode icon -->
  <rect x="135" y="200" width="30" height="22" rx="2" fill="#0F172A"/>
  <rect x="138" y="203" width="7" height="7" fill="#FFFFFF"/>
  <rect x="155" y="203" width="7" height="7" fill="#FFFFFF"/>
  <rect x="138" y="212" width="7" height="7" fill="#FFFFFF"/>
  <rect x="147" y="208" width="6" height="6" fill="#38BDF8"/>
</svg>
