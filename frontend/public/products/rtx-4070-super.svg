<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="gpuShroud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="fanRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="24" fill="#0B132B"/>
  <rect x="10" y="10" width="280" height="280" rx="20" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- PCIe Connector Bracket (Left) -->
  <rect x="25" y="70" width="15" height="150" rx="3" fill="#64748B" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="28" y="90" width="8" height="20" rx="2" fill="#0F172A"/>
  <rect x="28" y="125" width="8" height="20" rx="2" fill="#0F172A"/>

  <!-- GPU Main Shroud Body -->
  <rect x="40" y="75" width="235" height="125" rx="10" fill="url(#gpuShroud)" stroke="#475569" stroke-width="2.5"/>

  <!-- Top GeForce RTX Badge -->
  <rect x="55" y="83" width="90" height="16" rx="3" fill="#090D16"/>
  <text x="100" y="95" fill="#22C55E" font-family="sans-serif" font-size="9" font-weight="900" text-anchor="middle">GEFORCE RTX™</text>

  <!-- Fan 1 (Left) -->
  <g transform="translate(110, 142)">
    <circle cx="0" cy="0" r="38" fill="#090D16" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="url(#fanRing)" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
    <path d="M -30 0 L 30 0 M 0 -30 L 0 30 M -21 -21 L 21 21 M -21 21 L 21 -21" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Fan 2 (Right) -->
  <g transform="translate(205, 142)">
    <circle cx="0" cy="0" r="38" fill="#090D16" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="url(#fanRing)" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
    <path d="M -30 0 L 30 0 M 0 -30 L 0 30 M -21 -21 L 21 21 M -21 21 L 21 -21" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- PCIe 4.0 Gold Connector Fingers (Bottom) -->
  <rect x="55" y="200" width="120" height="12" fill="#090D16"/>
  <g fill="#FACC15">
    <rect x="60" y="202" width="3" height="8"/>
    <rect x="66" y="202" width="3" height="8"/>
    <rect x="72" y="202" width="3" height="8"/>
    <rect x="78" y="202" width="3" height="8"/>
    <rect x="87" y="202" width="3" height="8"/>
    <rect x="93" y="202" width="3" height="8"/>
    <rect x="99" y="202" width="3" height="8"/>
    <rect x="105" y="202" width="3" height="8"/>
    <rect x="111" y="202" width="3" height="8"/>
    <rect x="117" y="202" width="3" height="8"/>
    <rect x="123" y="202" width="3" height="8"/>
    <rect x="129" y="202" width="3" height="8"/>
    <rect x="135" y="202" width="3" height="8"/>
    <rect x="141" y="202" width="3" height="8"/>
    <rect x="147" y="202" width="3" height="8"/>
    <rect x="153" y="202" width="3" height="8"/>
    <rect x="159" y="202" width="3" height="8"/>
    <rect x="165" y="202" width="3" height="8"/>
  </g>

  <!-- 12GB Super Badge -->
  <rect x="200" y="83" width="60" height="16" rx="3" fill="#15803D"/>
  <text x="230" y="95" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">SUPER 12G</text>
</svg>
