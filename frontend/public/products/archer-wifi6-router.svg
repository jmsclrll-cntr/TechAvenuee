<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="routerBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="24" fill="#0B132B"/>
  <rect x="10" y="10" width="280" height="280" rx="20" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- 6 External Antennas -->
  <!-- Antenna 1 (Far Left angled) -->
  <line x1="45" y1="160" x2="20" y2="60" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
  <!-- Antenna 2 (Mid Left angled) -->
  <line x1="85" y1="150" x2="65" y2="45" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
  <!-- Antenna 3 (Rear Left vertical) -->
  <line x1="125" y1="150" x2="115" y2="40" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
  <!-- Antenna 4 (Rear Right vertical) -->
  <line x1="175" y1="150" x2="185" y2="40" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
  <!-- Antenna 5 (Mid Right angled) -->
  <line x1="215" y1="150" x2="235" y2="45" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
  <!-- Antenna 6 (Far Right angled) -->
  <line x1="255" y1="160" x2="280" y2="60" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>

  <!-- Router Main Chassis (Angular Hexagon / Stealth) -->
  <polygon points="40,165 60,230 240,230 260,165 220,150 80,150" fill="url(#routerBody)" stroke="#475569" stroke-width="2.5"/>

  <!-- Geometric Ventilation Pattern Plate -->
  <polygon points="80,160 90,205 210,205 220,160" fill="#090D16" stroke="#334155" stroke-width="1.5"/>
  <g stroke="#38BDF8" stroke-width="1.5" opacity="0.6">
    <line x1="110" y1="170" x2="190" y2="170"/>
    <line x1="100" y1="180" x2="200" y2="180"/>
    <line x1="105" y1="190" x2="195" y2="190"/>
    <line x1="115" y1="200" x2="185" y2="200"/>
  </g>

  <!-- Front LED Status Light Bar -->
  <g fill="#10B981">
    <circle cx="115" cy="220" r="2.5"/>
    <circle cx="125" cy="220" r="2.5"/>
    <circle cx="135" cy="220" r="2.5"/>
    <circle cx="145" cy="220" r="2.5"/>
    <circle cx="155" cy="220" r="2.5"/>
    <circle cx="165" cy="220" r="2.5"/>
    <circle cx="175" cy="220" r="2.5"/>
    <circle cx="185" cy="220" r="2.5"/>
  </g>

  <!-- WiFi 6 Badge -->
  <rect x="95" y="245" width="110" height="24" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="150" y="261" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="900" text-anchor="middle">WiFi 6 • 5400Mbps</text>
</svg>
