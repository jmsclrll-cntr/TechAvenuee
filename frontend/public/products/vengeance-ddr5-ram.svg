  <!-- Dual Channel Indicator Tag -->
  <rect x="100" y="200" width="100" height="24" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="150" y="216" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">2 × 16GB DUAL KIT</text>
