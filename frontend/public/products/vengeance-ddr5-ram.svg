    <rect x="83" y="162" width="2.5" height="8"/>
    <rect x="88" y="162" width="2.5" height="8"/>
    <rect x="93" y="162" width="2.5" height="8"/>
    <rect x="98" y="162" width="2.5" height="8"/>
    <rect x="103" y="162" width="2.5" height="8"/>
    <rect x="108" y="162" width="2.5" height="8"/>
    <rect x="113" y="162" width="2.5" height="8"/>
    <!-- Key notch -->
    <rect x="135" y="162" width="2.5" height="8"/>
    <rect x="140" y="162" width="2.5" height="8"/>
    <rect x="145" y="162" width="2.5" height="8"/>
    <rect x="150" y="162" width="2.5" height="8"/>
    <rect x="155" y="162" width="2.5" height="8"/>
    <rect x="160" y="162" width="2.5" height="8"/>
    <rect x="165" y="162" width="2.5" height="8"/>
    <rect x="170" y="162" width="2.5" height="8"/>
    <rect x="175" y="162" width="2.5" height="8"/>
    <rect x="180" y="162" width="2.5" height="8"/>
    <rect x="185" y="162" width="2.5" height="8"/>
    <rect x="190" y="162" width="2.5" height="8"/>
    <rect x="195" y="162" width="2.5" height="8"/>
    <rect x="200" y="162" width="2.5" height="8"/>
    <rect x="205" y="162" width="2.5" height="8"/>
    <rect x="210" y="162" width="2.5" height="8"/>
    <rect x="215" y="162" width="2.5" height="8"/>
