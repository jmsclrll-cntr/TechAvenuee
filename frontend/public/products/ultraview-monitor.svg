<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="monitorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="24" fill="#0B132B"/>
  <rect x="10" y="10" width="280" height="280" rx="20" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Monitor Stand Base (V-shape) -->
  <path d="M 85 260 L 150 220 L 215 260 L 205 263 L 150 226 L 95 263 Z" fill="#64748B"/>
  <!-- Stand Pillar -->
  <rect x="144" y="170" width="12" height="60" fill="#334155" stroke="#475569" stroke-width="1"/>

  <!-- Monitor Frame Bezel (Slight curve effect) -->
  <rect x="30" y="45" width="240" height="145" rx="8" fill="#0F172A" stroke="#334155" stroke-width="2"/>

  <!-- Screen Content - High Refresh Rate Visual -->
  <rect x="36" y="51" width="228" height="133" rx="4" fill="url(#monitorGrad)"/>

  <!-- Dynamic Game graphic / Speed lines -->
  <circle cx="150" cy="115" r="30" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 3"/>
  <path d="M 60 160 L 110 95 L 160 130 L 200 80 L 240 120" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="200" cy="80" r="5" fill="#FACC15"/>

  <!-- 165Hz QHD Badge -->
  <rect x="42" y="58" width="60" height="18" rx="4" fill="#0F172A" opacity="0.85"/>
  <text x="72" y="71" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">165Hz QHD</text>
  
  <!-- Power LED -->
  <circle cx="150" cy="186" r="2" fill="#38BDF8"/>
</svg>
